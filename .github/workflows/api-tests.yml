name: API Automation Tests

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI Server
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for FastAPI Server
        run: |
          for i in {1..10}; do
            if curl -f http://127.0.0.1:8000/docs; then
              echo "FastAPI server is ready!"
              break
            fi
            echo "Waiting for FastAPI server..."
            sleep 2
          done

      - name: Run API Tests
        env:
          RUN_IN_DOCKER: "true"
        run: pytest --alluredir=allure-results
      
      - name: Show Uvicorn Log on Failure
        if: failure()
        run: cat uvicorn.log


      - name: Upload Uvicorn Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Uvicorn-Log
          path: uvicorn.log

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HTML-Test-Report
          path: reports/report.html

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Allure-Results
          path: allure-results
